[package]
name = "kotatsu"
description = "Sandbox fleet control plane and session gateway core for AWS Lambda MicroVMs"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["aws", "lambda", "microvm", "firecracker", "sandbox"]
categories = ["network-programming", "api-bindings", "virtualization"]

[features]
default = ["sqlite"]
sqlite = ["dep:tokio-rusqlite"]

[dependencies]
async-trait.workspace = true
aws-config.workspace = true
aws-sdk-lambdamicrovms.workspace = true
chrono.workspace = true
http.workspace = true
metrics.workspace = true
parking_lot.workspace = true
reqwest.workspace = true
rust_decimal.workspace = true
rust_decimal_macros.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-rusqlite = { workspace = true, optional = true }
tokio-tungstenite.workspace = true
tracing.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]
futures-util.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-rusqlite.workspace = true
