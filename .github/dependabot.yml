version: 2
updates:
  # Keep SHA-pinned actions fresh — Dependabot bumps both the SHA and
  # the trailing version comment.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
  # The Dockerfile pins its base images as `tag@sha256:…`; Dependabot
  # moves the digest when the tag is republished.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
